<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김종현의 블로그</title>
    <!-- html과 css연결 -->
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <header class="header">
        <a  
        
            href="https://jonglab.tistory.com/" 
            target="_blank"
            rel="noopenrer noreferrer" 
        >

            <img
                class="profile"
                src="./images/profile.png" 
                alt="내 프로필 사진" 
            />

        </a>

    <h1>종현이의 블로그</h1>

    <nav class="header-social" aria-label="소셜 링크">


        <!-- Github -->
        <a  
            class="social-link"    
            href="https://github.com/KimJongHyun2" 
            target="_blank"
            rel="noopenrer noreferrer"
        >
        
            <img 
                class="github-icon" 
                src="./images/github-icon.png" 
                alt="Github 프로필로 이동" 
            />
        </a>
    </nav>
    </header>
    
</body>
</html>
